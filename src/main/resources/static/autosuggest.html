<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Being Infinity</title>

<style>

body{
    text-align:center;
    font-family:"Times New Roman", serif;
}

.box{
    width:700px;
    margin:auto;
    margin-top:50px;
    padding:30px;
    border:3px solid red;
    border-radius:15px;
    position:relative;
}

.gear-icon{
    position:absolute;
    top:15px;
    left:15px;
    font-size:22px;
}

.status{
    position:absolute;
    top:15px;
    right:15px;
    font-size:18px;
}

.being{
    color:blue;
}

.infinity{
    color:black;
}

.tagline{
    color:gray;
    font-size:22px;
}

input{
    width:250px;
    height:30px;
}

.footer{
    margin-top:30px;
    color:gray;
}

</style>

</head>

<body>

<div class="box">

    <span class="gear-icon">&#9881;</span>

    <span class="status">&#8226; online | &#128339; - ms</span>

    <h1>
        <span class="being">Being</span><span class="infinity">Infinity</span>
    </h1>

    <p class="tagline">
        One million phrases. Four Algorithms. Prefix Based Auto Suggest.
    </p>

    <span>&#128269;</span>

    <input type="text" placeholder="Start typing to search">

</div>

<div class="footer">
    Copyright &copy; Being Infinity Pvt. Ltd.
</div>

</body>
</html>
